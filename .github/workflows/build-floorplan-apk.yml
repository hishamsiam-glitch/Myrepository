name: Build Floor Plan Tracer APK

on:
  push:
    paths:
      - "floorplan_app/**"
      - ".github/workflows/build-floorplan-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: floorplan_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # The 3D viewer (three.js) is pre-bundled into assets/web/viewer.html
      # and committed, so the APK build needs no Node. This job still
      # rebuilds it and checks the committed file is up to date, then runs
      # the headless-Chromium viewer tests.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check the bundled 3D viewer is current
        working-directory: floorplan_app/web3d
        run: |
          npm ci
          npm run build
          git diff --exit-code -- ../assets/web/viewer.html || {
            echo "assets/web/viewer.html is out of date: run 'npm run build' in floorplan_app/web3d and commit the result."
            exit 1
          }
      - name: Test the 3D viewer in headless Chromium
        working-directory: floorplan_app/web3d
        run: |
          npx playwright install --with-deps chromium
          npm test

      # If upload-key secrets are configured (Settings -> Secrets and
      # variables -> Actions), reconstruct android/key.properties and the
      # keystore so the release build is signed with the real upload key.
      - name: Restore upload keystore
        id: signing
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        if: env.UPLOAD_KEYSTORE_BASE64 != ''
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties << EOT
          storePassword=${{ secrets.UPLOAD_STORE_PASSWORD }}
          keyPassword=${{ secrets.UPLOAD_KEY_PASSWORD }}
          keyAlias=${{ secrets.UPLOAD_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOT
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # Without key.properties the release build is debug-signed: fine for
      # sideloading, not for a Play Store upload. One APK per CPU
      # architecture keeps each download small; arm64-v8a is the one for
      # essentially every current phone.
      - run: flutter build apk --release --split-per-abi

      - name: Build signed app bundle
        if: steps.signing.outputs.signed == 'true'
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: floorplan-tracer-apk
          path: floorplan_app/build/app/outputs/flutter-apk/*.apk

      # Also publish as a GitHub Release so the APK can be downloaded
      # straight to a phone from the repository's Releases page.
      - name: Publish sideload release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete floorplan-latest --yes --repo "$GITHUB_REPOSITORY" || true
          git push origin :refs/tags/floorplan-latest || true
          gh release create floorplan-latest \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            build/app/outputs/flutter-apk/app-x86_64-release.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Floor Plan Tracer - sideload build" \
            --notes "Debug-signed APKs of Floor Plan Tracer for sideloading. Most phones (including current Samsung devices) should install app-arm64-v8a-release.apk. Camera (AR) tracing needs an ARCore-capable phone with Google Play Services for AR; photo and manual tracing work everywhere. Built from commit ${{ github.sha }}." \
            --target "${{ github.sha }}"

      - name: Publish signed release bundle
        if: steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete floorplan-playstore --yes --repo "$GITHUB_REPOSITORY" || true
          git push origin :refs/tags/floorplan-playstore || true
          gh release create floorplan-playstore \
            build/app/outputs/bundle/release/app-release.aab \
            --repo "$GITHUB_REPOSITORY" \
            --title "Floor Plan Tracer - Play Store bundle (signed)" \
            --notes "Signed with the upload key - this is the .aab to upload to Play Console. Built from commit ${{ github.sha }}." \
            --target "${{ github.sha }}"
