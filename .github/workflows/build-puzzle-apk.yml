name: Build Crate Quest APK

on:
  push:
    paths:
      - "puzzle_game/**"
      - ".github/workflows/build-puzzle-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: puzzle_game
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Every one of the 100 levels is re-verified: the shipped solution is
      # replayed through the game engine and an independent solver confirms
      # optimality where it can.
      - name: Verify levels
        run: node test/verify_levels.js

      - name: Browser smoke test
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node test/ui.test.js

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      # If upload-key secrets are configured (Settings -> Secrets and
      # variables -> Actions), reconstruct android/key.properties and the
      # keystore from them so the release build is signed with the real
      # upload key instead of falling back to the debug key. These are the
      # same secrets the calculator workflow uses.
      - name: Restore upload keystore
        id: signing
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        if: env.UPLOAD_KEYSTORE_BASE64 != ''
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties << EOF
          storePassword=${{ secrets.UPLOAD_STORE_PASSWORD }}
          keyPassword=${{ secrets.UPLOAD_KEY_PASSWORD }}
          keyAlias=${{ secrets.UPLOAD_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # Without android/key.properties this falls back to debug signing,
      # which is fine for sideloading/testing but not for a Play Store upload.
      - name: Build release APK
        working-directory: puzzle_game/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Build signed app bundle
        if: steps.signing.outputs.signed == 'true'
        working-directory: puzzle_game/android
        run: ./gradlew bundleRelease --no-daemon

      - name: Collect outputs
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/crate-quest.apk
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab dist/crate-quest.aab
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: crate-quest-apk
          path: puzzle_game/dist/*

      # Also publish as a GitHub Release asset (served from github.com's own
      # CDN, reachable from places that can't fetch Actions artifacts).
      - name: Publish sideload release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete crate-quest-latest --yes --repo "$GITHUB_REPOSITORY" || true
          git push origin :refs/tags/crate-quest-latest || true
          gh release create crate-quest-latest \
            dist/crate-quest.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Crate Quest - sideload build" \
            --notes "Crate Quest puzzle game (100 levels). Automated $( [ '${{ steps.signing.outputs.signed }}' = 'true' ] && echo 'upload-key-signed' || echo 'debug-signed' ) APK for sideloading; works on any Android 7.0+ phone. Built from commit ${{ github.sha }}." \
            --target "${{ github.sha }}"

      - name: Publish signed release bundle
        if: steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete crate-quest-playstore --yes --repo "$GITHUB_REPOSITORY" || true
          git push origin :refs/tags/crate-quest-playstore || true
          gh release create crate-quest-playstore \
            dist/crate-quest.aab \
            --repo "$GITHUB_REPOSITORY" \
            --title "Crate Quest - Play Store upload bundle (signed)" \
            --notes "Signed with the upload key - this is the .aab to upload to Play Console. Built from commit ${{ github.sha }}." \
            --target "${{ github.sha }}"
