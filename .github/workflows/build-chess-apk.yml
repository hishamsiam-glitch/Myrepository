name: Build Chess APK

on:
  push:
    paths:
      - "chess/**"
      - ".github/workflows/build-chess-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chess
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # If upload-key secrets are configured (Settings -> Secrets and
      # variables -> Actions), reconstruct android/key.properties and the
      # keystore from them so the release build is signed with a real upload
      # key instead of falling back to the debug key. Without them the build
      # still succeeds - see the note on the release below.
      - name: Restore upload keystore
        id: signing
        env:
          CHESS_UPLOAD_KEYSTORE_BASE64: ${{ secrets.CHESS_UPLOAD_KEYSTORE_BASE64 }}
        if: env.CHESS_UPLOAD_KEYSTORE_BASE64 != ''
        run: |
          echo "$CHESS_UPLOAD_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties << EOF
          storePassword=${{ secrets.CHESS_UPLOAD_STORE_PASSWORD }}
          keyPassword=${{ secrets.CHESS_UPLOAD_KEY_PASSWORD }}
          keyAlias=${{ secrets.CHESS_UPLOAD_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # No android/key.properties is committed, so by default this falls back
      # to debug signing (see chess/android/app/build.gradle.kts). That makes
      # the APK installable for sideloading onto your own device, but NOT
      # suitable for a Play Store upload.
      #
      # --split-per-abi produces one APK per CPU architecture instead of one
      # universal APK bundling all of them, so each download is a fraction of
      # the size.
      # A maximum-compatibility build, and the one the zip ships: one
      # universal APK covering every CPU architecture (so a wrong-ABI download
      # is impossible) with R8 and resource shrinking off (so neither can
      # mangle the manifest or resources). It is bigger, but "installs
      # everywhere" beats "small" for a sideloaded build.
      - name: Build maximum-compatibility APK
        run: |
          cp android/gradle.properties android/gradle.properties.bak
          echo "chess.disableMinify=true" >> android/gradle.properties
          flutter build apk --release
          mkdir -p "$RUNNER_TEMP/compat"
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/compat/Chess.apk"
          mv android/gradle.properties.bak android/gradle.properties

      - run: flutter build apk --release --split-per-abi

      - name: Build signed app bundle
        if: steps.signing.outputs.signed == 'true'
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: chess-apk
          path: chess/build/app/outputs/flutter-apk/*.apk

      # Actions artifacts are served from Azure Blob Storage, which isn't
      # reachable from every environment that might want the build. Also
      # publish to a GitHub Release, which is served from github.com's own CDN.
      # Chrome on Android will not finalise a downloaded .apk while Play
      # Protect holds it for verification - it sits at 100% forever. A .zip
      # downloads normally, and deflate roughly halves the size because the
      # .so files inside an APK are stored uncompressed. So the zip is the
      # download we point people at, with the raw APKs kept for anyone using
      # adb or a file manager that copes.
      - name: Publish sideload release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "app-$abi-release.apk" "chess-$abi-release.apk"
          done
          cp "$RUNNER_TEMP/compat/Chess.apk" Chess.apk
          {
            echo "Chess for Android"
            echo "================="
            echo
            echo "IMPORTANT: extract Chess.apk out of this zip first, then"
            echo "install the extracted file. Tapping the APK from inside an"
            echo "archive app (RAR, ZArchiver) hands the installer a file from"
            echo "that app's private cache, and Android rejects it with"
            echo "\"There's a problem with the app file\"."
            echo
            echo "1. Extract Chess.apk to Downloads."
            echo "2. Open the Files app, go to Downloads, tap Chess.apk."
            echo "3. Allow \"install unknown apps\" for Files when asked."
            echo
            echo "Universal build: works on every CPU architecture."
            echo "Requires Android 7.0 or newer."
            echo "sha256: $(sha256sum Chess.apk | cut -d' ' -f1)"
            echo "size:   $(stat -c%s Chess.apk) bytes"
            echo
            echo "Signed with a debug key: fine for your own device, not"
            echo "valid for a Play Store upload."
            echo "Built from commit ${{ github.sha }}."
          } > INSTALL.txt
          zip -9 Chess-apk.zip Chess.apk INSTALL.txt
          rm Chess.apk INSTALL.txt
          cd - > /dev/null

          gh release delete chess-sideload-latest --yes --repo "$GITHUB_REPOSITORY" || true
          git push origin :refs/tags/chess-sideload-latest || true
          gh release create chess-sideload-latest \
            build/app/outputs/flutter-apk/Chess-apk.zip \
            build/app/outputs/flutter-apk/chess-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/chess-armeabi-v7a-release.apk \
            build/app/outputs/flutter-apk/chess-x86_64-release.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Chess - sideload build (debug-signed)" \
            --notes "Download **Chess-apk.zip**, extract Chess.apk out of it, and install the extracted file from the Files app. Two things this works around: Chrome on Android often will not finalise a direct .apk download (it sticks at 100% forever), and tapping an APK from inside an archive app makes Android reject it with \"There is a problem with the app file\". The APK in the zip is a universal build with R8 off, so it installs on any CPU architecture. The per-ABI APKs are also here for adb install. Debug-signed: fine for your own device, not valid for a Play Store upload. Built from commit ${{ github.sha }}." \
            --target "${{ github.sha }}"

      - name: Publish signed release bundle
        if: steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/bundle/release/app-release.aab \
             build/app/outputs/bundle/release/chess-release.aab
          gh release delete chess-playstore-latest --yes --repo "$GITHUB_REPOSITORY" || true
          git push origin :refs/tags/chess-playstore-latest || true
          gh release create chess-playstore-latest \
            build/app/outputs/bundle/release/chess-release.aab \
            --repo "$GITHUB_REPOSITORY" \
            --title "Chess - Play Store upload bundle (signed)" \
            --notes "Signed with the real upload key - this is the .aab to upload to Play Console. Built from commit ${{ github.sha }}." \
            --target "${{ github.sha }}"
