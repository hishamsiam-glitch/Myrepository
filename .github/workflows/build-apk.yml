name: Build APK

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # No android/key.properties is provided in CI, so this build falls
      # back to debug signing (see app/android/app/build.gradle.kts). That
      # makes it installable for sideloading/testing, but NOT suitable for
      # a Play Store upload - see docs/PLAY_STORE_RELEASE.md for that.
      #
      # --split-per-abi produces one APK per CPU architecture instead of a
      # single universal APK bundling all of them, so each download is a
      # fraction of the size (a universal build here is ~44MB; arm64-v8a
      # alone, which covers essentially all modern phones, is far smaller).
      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: scientific-calculator-apk
          path: app/build/app/outputs/flutter-apk/*.apk

      # Actions artifacts are served from Azure Blob Storage, which isn't
      # reachable from every environment that might want the build (e.g.
      # a sandboxed agent session). Also publish it as a GitHub Release
      # asset, which is served from github.com's own CDN instead.
      - name: Publish sideload release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete sideload-latest --yes --repo "$GITHUB_REPOSITORY" || true
          git push origin :refs/tags/sideload-latest || true
          gh release create sideload-latest \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            build/app/outputs/flutter-apk/app-x86_64-release.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Sideload build (debug-signed)" \
            --notes "Automated debug-signed APKs for sideloading/testing only - not suitable for Play Store submission. Most modern phones (including current Samsung devices) should use app-arm64-v8a-release.apk. Built from commit ${{ github.sha }}." \
            --target "${{ github.sha }}"
