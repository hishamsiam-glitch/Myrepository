name: Build APK

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # No android/key.properties is provided in CI, so this build falls
      # back to debug signing (see app/android/app/build.gradle.kts). That
      # makes it installable for sideloading/testing, but NOT suitable for
      # a Play Store upload - see docs/PLAY_STORE_RELEASE.md for that.
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: scientific-calculator-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
