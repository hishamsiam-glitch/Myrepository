name: Build Space Invaders 3D APK

on:
  push:
    paths:
      - "space-invaders-3d/**"
      - ".github/workflows/build-game-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: space-invaders-3d/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Same upload-key secrets as the calculator build (see
      # docs/PLAY_STORE_RELEASE.md). When present the APK is signed with the
      # real upload key; otherwise it falls back to debug signing, which is
      # fine for sideloading but not for the Play Store.
      - name: Restore upload keystore
        id: signing
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        if: env.UPLOAD_KEYSTORE_BASE64 != ''
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
          cat > key.properties << EOF
          storePassword=${{ secrets.UPLOAD_STORE_PASSWORD }}
          keyPassword=${{ secrets.UPLOAD_KEY_PASSWORD }}
          keyAlias=${{ secrets.UPLOAD_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk space-invaders-3d.apk

      - uses: actions/upload-artifact@v4
        with:
          name: space-invaders-3d-apk
          path: space-invaders-3d/android/space-invaders-3d.apk

      # Also publish as a GitHub Release asset so it can be downloaded
      # straight to a phone from the repository's Releases page.
      - name: Publish sideload release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          if [ "$SIGNED" = "true" ]; then SIGNOTE="signed with the upload key"; else SIGNOTE="debug-signed, for sideloading/testing only"; fi
          gh release delete space-invaders-3d-latest --yes --repo "$GITHUB_REPOSITORY" || true
          git push origin :refs/tags/space-invaders-3d-latest || true
          gh release create space-invaders-3d-latest \
            space-invaders-3d.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Space Invaders 3D - Android APK" \
            --notes "Space Invaders 3D for Android ($SIGNOTE). Download space-invaders-3d.apk on your phone, allow installs from this source when asked, and open it. Tilt to steer, tap to fire. Built from commit ${{ github.sha }}." \
            --target "${{ github.sha }}"
